# Local development database: Postgres 16 with the pgvector extension.
# Start:  docker compose up -d db      Stop: docker compose down
# Data lives in the named volume "dbdata"; `docker compose down -v` erases it.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dreamcatcher
      POSTGRES_USER: dreamcatcher
      # Local-only default; set POSTGRES_PASSWORD in your shell to override.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dreamcatcher-dev}
    ports:
      - "127.0.0.1:5432:5432" # reachable from this Mac only
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamcatcher -d dreamcatcher"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dbdata:
